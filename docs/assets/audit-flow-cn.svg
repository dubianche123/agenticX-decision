<text x="308" y="372" font-size="20" font-weight="650" fill="#263C59" text-anchor="start">JSON 规则规格</text>
<text x="308" y="398" font-size="14" font-weight="400" fill="#5F738D" text-anchor="start">映射为模板与参数</text>
<rect x="540" y="340" width="240" height="88" rx="13" fill="#EAF1FF" stroke="#6C93D3" stroke-width="1.3"/>
<text x="558" y="372" font-size="20" font-weight="650" fill="#263C59" text-anchor="start">AgenticX ReAct</text>
<text x="558" y="398" font-size="14" font-weight="400" fill="#5F738D" text-anchor="start">每条审核项独立上下文</text>
