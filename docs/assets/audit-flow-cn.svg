<text x="308" y="193" font-size="14" font-weight="400" fill="#5F738D" text-anchor="start">pypdf 文本层</text>
<rect x="540" y="135" width="240" height="88" rx="13" fill="#F0F5FF" stroke="#A2BCE4" stroke-width="1.3"/>
<text x="558" y="167" font-size="20" font-weight="650" fill="#263C59" text-anchor="start">search_text</text>
<text x="558" y="193" font-size="14" font-weight="400" fill="#5F738D" text-anchor="start">片段与字符位置</text>
