<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">单条审核项如何执行</title><desc id="desc">文档文本通过搜索工具进入独立 ReAct 上下文；规则工具计算条件，结构校验后输出待复核结果。</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 7 4 1 7" fill="none" stroke="#7186A4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="1" y="1" width="1198" height="648" rx="20" fill="#FAFCFF" stroke="#DFE6F0"/>
<g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="40" y="43" font-size="25" font-weight="650" fill="#263C59" text-anchor="start">单条审核项如何执行</text>
<text x="40" y="74" font-size="16" font-weight="400" fill="#60748E" text-anchor="start">检索上下文、规则计算与输出校验分别可见。</text>
<text x="40" y="113" font-size="12" font-weight="650" fill="#6A809C" text-anchor="start">文档上下文</text>
<text x="40" y="318" font-size="12" font-weight="650" fill="#6A809C" text-anchor="start">规则与执行</text>
