<text x="58" y="372" font-size="20" font-weight="650" fill="#263C59" text-anchor="start">自然语言规则</text>
<text x="58" y="398" font-size="14" font-weight="400" fill="#5F738D" text-anchor="start">用户定义的审核条件</text>
