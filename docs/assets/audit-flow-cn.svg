<text x="868" y="532" font-size="20" font-weight="650" fill="#263C59" text-anchor="start">供人复核的结果</text>
<text x="868" y="558" font-size="14" font-weight="400" fill="#5F738D" text-anchor="start">结论、证据、阻断标记</text>
