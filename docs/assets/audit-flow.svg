<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">How one audit item runs</title><desc id="desc">Document text is retrieved through a search tool into an isolated ReAct run; code tools calculate checks and a structural validator produces review results.</desc>
