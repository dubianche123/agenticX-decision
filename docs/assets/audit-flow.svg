<text x="40" y="74" font-size="16" font-weight="400" fill="#60748E" text-anchor="start">Retrieval context, rule execution, and output checks stay explicit.</text>
<text x="40" y="113" font-size="12" font-weight="650" fill="#6A809C" text-anchor="start">DOCUMENT CONTEXT</text>
<text x="40" y="318" font-size="12" font-weight="650" fill="#6A809C" text-anchor="start">RULE + EXECUTION</text>
