<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">AgenticX Decision — document review with explicit tools and evidence</title>
  <desc id="desc">A local decision-audit harness. Retrieve bounded text, execute code rules through AgenticX ReAct, and inspect structured results with evidence and blocking reasons.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101c35"/><stop offset="1" stop-color="#172c49"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#6ba6ff"/><stop offset="1" stop-color="#72e1d2"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity=".04"/></pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#90a8c7" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1280" height="480" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="480" rx="24" fill="url(#dots)"/>
  <path d="M1058 0 1280 222M1150 0l130 130" stroke="#78b6ef" stroke-opacity=".08" stroke-width="70"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(56 40)">
