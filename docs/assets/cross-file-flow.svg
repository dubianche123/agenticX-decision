<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="355" viewBox="0 0 1200 355" role="img" aria-labelledby="title desc">
<title id="title">Cross-document verification</title><desc id="desc">Locate the claim and attachment, inspect PDF page images with a vision model, and compare claimed and observed counts in Python.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 7 4 1 7" fill="none" stroke="#7186A4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="1" y="1" width="1198" height="353" rx="20" fill="#FAFCFF" stroke="#DFE6F0"/>
<g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="36" y="43" font-size="25" font-weight="650" fill="#263C59" text-anchor="start">Cross-document verification</text>
<text x="36" y="74" font-size="16" font-weight="400" fill="#60748E" text-anchor="start">A separate runner connects the main-document claim to attachment evidence.</text>
<rect x="36" y="133" width="208" height="112" rx="13" fill="#F0F5FF" stroke="#A2BCE4" stroke-width="1.3"/>
<text x="54" y="165" font-size="20" font-weight="650" fill="#263C59" text-anchor="start">PDF package</text>
<text x="54" y="191" font-size="14" font-weight="400" fill="#5F738D" text-anchor="start">Main file + attachments</text>
<path d="M244 189H266" fill="none" stroke="#7186A4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="266" y="133" width="208" height="112" rx="13" fill="#EAF1FF" stroke="#6C93D3" stroke-width="1.3"/>
<text x="284" y="165" font-size="20" font-weight="650" fill="#263C59" text-anchor="start">Text agent</text>
<text x="284" y="191" font-size="14" font-weight="400" fill="#5F738D" text-anchor="start">Locate claim</text>
<text x="284" y="212" font-size="14" font-weight="400" fill="#5F738D" text-anchor="start">Locate attachment</text>
<path d="M474 189H496" fill="none" stroke="#7186A4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="496" y="133" width="208" height="112" rx="13" fill="#EAF1FF" stroke="#6C93D3" stroke-width="1.3"/>
<text x="514" y="165" font-size="20" font-weight="650" fill="#263C59" text-anchor="start">Vision model</text>
<text x="514" y="191" font-size="14" font-weight="400" fill="#5F738D" text-anchor="start">Inspect page images</text>
<text x="514" y="212" font-size="14" font-weight="400" fill="#5F738D" text-anchor="start">Count visible evidence</text>
<path d="M704 189H726" fill="none" stroke="#7186A4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="726" y="133" width="208" height="112" rx="13" fill="#E8F6EF" stroke="#73B397" stroke-width="1.3"/>
<text x="744" y="165" font-size="20" font-weight="650" fill="#263C59" text-anchor="start">Code comparator</text>
<text x="744" y="191" font-size="14" font-weight="400" fill="#5F738D" text-anchor="start">Claim = evidence</text>
<text x="744" y="212" font-size="14" font-weight="400" fill="#5F738D" text-anchor="start">Minimum also met</text>
<path d="M934 189H956" fill="none" stroke="#7186A4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="956" y="133" width="208" height="112" rx="13" fill="#F0EEFA" stroke="#A49AC5" stroke-width="1.3"/>
<text x="974" y="165" font-size="20" font-weight="650" fill="#263C59" text-anchor="start">Review result</text>
<text x="974" y="191" font-size="14" font-weight="400" fill="#5F738D" text-anchor="start">Verdict + evidence</text>
<text x="36" y="293" font-size="15" font-weight="650" fill="#60748E" text-anchor="start">run_cross_file() · engine.py</text>
<text x="36" y="322" font-size="14" font-weight="400" fill="#60748E" text-anchor="start">Live runs require a vision model. The mock checks only the comparator, not OCR or model quality.</text>
