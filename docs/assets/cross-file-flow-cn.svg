<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="355" viewBox="0 0 1200 355" role="img" aria-labelledby="title desc">
<title id="title">跨文件核验路径</title><desc id="desc">定位主文件申报值和附件，视觉模型查看 PDF 页图，Python 比较申报与实证次数。</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 7 4 1 7" fill="none" stroke="#7186A4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="1" y="1" width="1198" height="353" rx="20" fill="#FAFCFF" stroke="#DFE6F0"/>
<g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<text x="36" y="43" font-size="25" font-weight="650" fill="#263C59" text-anchor="start">跨文件核验路径</text>
<text x="36" y="74" font-size="16" font-weight="400" fill="#60748E" text-anchor="start">主文件与附件走同一条可检查的核验链路。</text>
<rect x="36" y="133" width="208" height="112" rx="13" fill="#F0F5FF" stroke="#A2BCE4" stroke-width="1.3"/>
<text x="54" y="165" font-size="20" font-weight="650" fill="#263C59" text-anchor="start">本地材料包</text>
<text x="54" y="191" font-size="14" font-weight="400" fill="#5F738D" text-anchor="start">主 PDF 与附件</text>
<path d="M244 189H266" fill="none" stroke="#7186A4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="266" y="133" width="208" height="112" rx="13" fill="#EAF1FF" stroke="#6C93D3" stroke-width="1.3"/>
<text x="284" y="165" font-size="20" font-weight="650" fill="#263C59" text-anchor="start">文本智能体</text>
<text x="284" y="191" font-size="14" font-weight="400" fill="#5F738D" text-anchor="start">定位申报值</text>
<text x="284" y="212" font-size="14" font-weight="400" fill="#5F738D" text-anchor="start">定位附件路径</text>
<path d="M474 189H496" fill="none" stroke="#7186A4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="496" y="133" width="208" height="112" rx="13" fill="#EAF1FF" stroke="#6C93D3" stroke-width="1.3"/>
<text x="514" y="165" font-size="20" font-weight="650" fill="#263C59" text-anchor="start">视觉模型</text>
<text x="514" y="191" font-size="14" font-weight="400" fill="#5F738D" text-anchor="start">查看 PDF 页图</text>
<text x="514" y="212" font-size="14" font-weight="400" fill="#5F738D" text-anchor="start">统计可见实证</text>
<path d="M704 189H726" fill="none" stroke="#7186A4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="726" y="133" width="208" height="112" rx="13" fill="#E8F6EF" stroke="#73B397" stroke-width="1.3"/>
<text x="744" y="165" font-size="20" font-weight="650" fill="#263C59" text-anchor="start">Python 比较器</text>
<text x="744" y="191" font-size="14" font-weight="400" fill="#5F738D" text-anchor="start">申报次数 = 实证次数</text>
<text x="744" y="212" font-size="14" font-weight="400" fill="#5F738D" text-anchor="start">同时满足次数下限</text>
<path d="M934 189H956" fill="none" stroke="#7186A4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="956" y="133" width="208" height="112" rx="13" fill="#F0EEFA" stroke="#A49AC5" stroke-width="1.3"/>
<text x="974" y="165" font-size="20" font-weight="650" fill="#263C59" text-anchor="start">核验结果</text>
<text x="974" y="191" font-size="14" font-weight="400" fill="#5F738D" text-anchor="start">结论与证据字段</text>
<text x="36" y="293" font-size="15" font-weight="650" fill="#60748E" text-anchor="start">run_cross_file() · engine.py</text>
<text x="36" y="322" font-size="14" font-weight="400" fill="#60748E" text-anchor="start">在线运行需要视觉模型；--mock 只测试比较器，不评测 OCR 或模型质量。</text>
</g></svg>